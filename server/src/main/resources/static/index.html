<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：配合 CSS 的 env(safe-area-inset-*) 适配 iPhone 底部横条，
       避免 fixed 底栏被 Home Indicator 遮挡（小程序由系统 tabBar 自动处理，Web 必须自己做）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>拼好车</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- 页面级样式按域拆分（RFC-016 多 Agent 边界）：ride.css 归 Ride 域 Agent，chat.css 归 Chat/User 域 Agent。
       这里集中预声明，页面模块不允许自行往 index.html 加标签。 -->
  <link rel="stylesheet" href="css/pages/ride.css">
  <link rel="stylesheet" href="css/pages/chat.css">
</head>
<body>
  <!-- 单页壳：头部（标题/返回）+ 视图容器 + 底部 tab（仅 tab 页显示），由 js/app.js 驱动 -->
  <div class="phc-app" id="phc-app">
    <header class="phc-header" id="phc-header" hidden>
      <button class="phc-header__back" id="phc-header-back" type="button" aria-label="返回" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="phc-header__title" id="phc-header-title">拼好车</h1>
    </header>
    <main class="phc-view" id="phc-view"></main>
    <nav class="phc-tabbar" id="phc-tabbar" hidden></nav>
  </div>
  <noscript>拼好车需要启用 JavaScript 才能使用。</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
