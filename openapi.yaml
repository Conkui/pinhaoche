openapi: 3.0.3
info: { title: 拼好车 API, version: v1 }
servers: [{ url: /api/v1 }]
paths:
  /places:
    get:
      summary: 获取启用的预设地点
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceList' } } } } }
  /rides:
    get:
      parameters:
        - { name: view, in: query, required: true, schema: { type: string, enum: [PREBOOK, BOOKED] } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RideList' } } } } }
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRideRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /rides/mine:
    get:
      summary: 当前用户发布的全部行程（RFC-008，含终态）
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RideList' } } } } }
  /rides/{rideId}:
    get:
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } } }
  /rides/{rideId}/join:
    post:
      parameters: [{ $ref: '#/components/parameters/RideId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Joined, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /rides/{rideId}/transitions:
    post:
      parameters: [{ $ref: '#/components/parameters/RideId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [targetStatus, version], properties: { targetStatus: { $ref: '#/components/schemas/RideStatus' }, version: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: Transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /chat-sessions:
    get:
      summary: 当前用户会话列表（RFC-001）
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatSessionSummary' } } } } } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rideId, peerUserId], properties: { rideId: { type: integer, format: int64 }, peerUserId: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: Existing or created session, content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } } } }
  /auth/login:
    post:
      summary: 微信登录换取 token（RFC-002）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, minLength: 1 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } } }
  /rides/import:
    post:
      summary: 导入"已打上"行程，创建 BOOKED Ride（RFC-004）
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportRideRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Ride' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /users/me:
    put:
      summary: 更新当前用户资料（RFC-011，身份只来自 token，请求体不含用户 id）
      description: nickname / avatarBase64 至少一个非空；缺省字段保持原值；同内容重复提交结果一致（幂等替换，**因此不需要 Idempotency-Key**）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /chat-sessions/{sessionId}/messages:
    get:
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }, { name: afterId, in: query, schema: { type: integer, format: int64, default: 0 } }]
      responses: { '200': { description: Incremental history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } } }
  /chat-sessions/{sessionId}/read:
    post:
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '204': { description: Marked read } }
components:
  parameters:
    RideId: { name: rideId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
  responses:
    Conflict: { description: 幂等冲突、状态冲突或容量不足, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    BadRequest: { description: 参数校验失败, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    Place: { type: object, required: [id, name, sortOrder], properties: { id: { type: integer, format: int64 }, name: { type: string }, sortOrder: { type: integer } } }
    PlaceList: { type: array, items: { $ref: '#/components/schemas/Place' } }
    PlaceRef: { type: object, required: [type, text], properties: { type: { type: string, enum: [PRESET, CUSTOM] }, placeId: { type: integer, format: int64, nullable: true }, text: { type: string, minLength: 1, maxLength: 100 } } }
    RideStatus: { type: string, enum: [DRAFT, PUBLISHED, MATCHING, BOOKED, IN_PROGRESS, ARRIVED, CLOSED, CANCELLED, EXPIRED] }
    CreateRideRequest: { type: object, required: [origin, destination, departTime, memberCount, capacity], properties: { origin: { $ref: '#/components/schemas/PlaceRef' }, destination: { $ref: '#/components/schemas/PlaceRef' }, departTime: { type: string, format: date-time }, memberCount: { type: integer, minimum: 1 }, capacity: { type: integer, minimum: 2, maximum: 8 }, remark: { type: string, maxLength: 300 }, waitingMinutes: { type: integer, enum: [5, 10, 15], nullable: true } } }
    Ride: { type: object, required: [id, ownerId, origin, destination, departTime, memberCount, capacity, status, version], properties: { id: { type: integer, format: int64 }, ownerId: { type: integer, format: int64 }, origin: { $ref: '#/components/schemas/PlaceRef' }, destination: { $ref: '#/components/schemas/PlaceRef' }, departTime: { type: string, format: date-time }, memberCount: { type: integer }, capacity: { type: integer }, status: { $ref: '#/components/schemas/RideStatus' }, plateNumber: { type: string, nullable: true }, provider: { type: string, nullable: true }, remainingDistance: { type: number, nullable: true }, distanceUpdatedAt: { type: string, format: date-time, nullable: true }, waitingMinutes: { type: integer, nullable: true }, version: { type: integer, format: int64 }, remark: { type: string, nullable: true } } }
    RideList: { type: array, items: { $ref: '#/components/schemas/Ride' } }
    ChatSessionSummary: { type: object, required: [id, rideId, peerUserId, unreadCount], properties: { id: { type: integer, format: int64 }, rideId: { type: integer, format: int64 }, peerUserId: { type: integer, format: int64 }, unreadCount: { type: integer }, lastMessagePreview: { type: string, nullable: true }, lastMessageAt: { type: string, format: date-time, nullable: true } } }
    LoginResponse: { type: object, required: [token, user], properties: { token: { type: string }, user: { type: object, required: [id, nickname], properties: { id: { type: integer, format: int64 }, nickname: { type: string }, avatar: { type: string, nullable: true } } } } }
    UserProfile: { type: object, required: [id, nickname], properties: { id: { type: integer, format: int64 }, nickname: { type: string }, avatar: { type: string, nullable: true, description: '头像相对路径（RFC-011，如 /files/xxx.jpg）；可加载地址 = 服务端 origin + 该路径。上传大小上限 2MiB，仅接受 JPEG/PNG/GIF/WEBP（魔数校验，拒绝 SVG）' } } }
    UpdateProfileRequest: { type: object, description: 'nickname 与 avatarBase64 至少一个非空；nickname 净化后 1-20 字符', properties: { nickname: { type: string, maxLength: 20, nullable: true }, avatarBase64: { type: string, nullable: true, description: 'base64（可含 data URL 前缀），解码后 ≤2MiB' } } }
    ImportRideRequest: { type: object, required: [provider, plateNumber, origin, destination], properties: { provider: { type: string, enum: [DIDI, HUAXIAOZHU, OTHER] }, plateNumber: { type: string, minLength: 1, maxLength: 32 }, origin: { $ref: '#/components/schemas/PlaceRef' }, destination: { $ref: '#/components/schemas/PlaceRef' }, remainingDistance: { type: number, nullable: true }, waitingMinutes: { type: integer, enum: [5, 10, 15], nullable: true } } }
    ChatSession: { type: object, required: [id, rideId, peerUserId, unreadCount], properties: { id: { type: integer, format: int64 }, rideId: { type: integer, format: int64 }, peerUserId: { type: integer, format: int64 }, unreadCount: { type: integer } } }
    Message: { type: object, required: [id, sessionId, senderId, clientMsgId, type, content, createdAt], properties: { id: { type: integer, format: int64 }, sessionId: { type: integer, format: int64 }, senderId: { type: integer, format: int64 }, clientMsgId: { type: string }, type: { type: string, enum: [TEXT] }, content: { type: string }, createdAt: { type: string, format: date-time } } }
    ApiError: { type: object, required: [code, message], properties: { code: { type: string, enum: [CAPACITY_FULL, VERSION_CONFLICT, ILLEGAL_TRANSITION, FORBIDDEN, IDEMPOTENCY_CONFLICT, VALIDATION_ERROR, RATE_LIMITED] }, message: { type: string } } }
